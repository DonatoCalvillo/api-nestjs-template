version: '3.8'

services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - my-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - my-network

  rest-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "9229:9229"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - my-network

  rest-api-prd:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${PORT:-3000}:3000"
    stop_grace_period: 35s
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - my-network

  # Second replica for local multi-instance testing (profile: multi-instance)
  # Set in .env: THROTTLE_STORAGE=redis, OUTBOX_RELAY_LOCK=redis, REDIS_URL=redis://redis:6379
  rest-api-prd-2:
    profiles:
      - multi-instance
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rest-api-prd-2
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${PORT_2:-3001}:3000"
    stop_grace_period: 35s
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  redis-data:
